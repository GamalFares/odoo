services:
  - type: web
    name: faris-jewelry-odoo
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: faris-jewelry-db
          property: host
      - key: DB_PORT
        value: 5432
      - key: DB_USER
        fromDatabase:
          name: faris-jewelry-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: faris-jewelry-db
          property: password
      - key: DB_NAME
        value: faris_jewelry
      - key: ADMIN_PASSWORD
        generateValue: true
